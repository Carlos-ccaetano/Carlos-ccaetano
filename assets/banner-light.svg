<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Caetano — backend developer</title>
  <desc id="desc">Off-white terminal-style banner with dark text for backend, fintech, and application security.</desc>
  <style>
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
    .cursor { animation: blink 1.1s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
  <rect width="900" height="260" fill="#F5F1E8"/>
  <rect x="24" y="24" width="852" height="212" fill="none" stroke="#1A1A1A" stroke-width="2"/>
  <g fill="#1A1A1A" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace">
    <text x="48" y="58" font-size="16" font-weight="700" letter-spacing="1.4">PROFILE / CC-001</text>
    <text x="852" y="58" text-anchor="end" font-size="16" font-weight="700" letter-spacing="1.4">BELO HORIZONTE / BR</text>
    <text x="48" y="138" font-size="58" font-weight="700" letter-spacing="1">CARLOS CAETANO</text>
    <text x="50" y="184" font-size="22" font-weight="700" letter-spacing=".8">BACKEND / FINTECH / APPLICATION SECURITY</text>
    <text x="48" y="222" font-size="18">$ systems ready</text>
    <rect class="cursor" x="228" y="204" width="14" height="22" fill="#B86E00"/>
  </g>
</svg>
