<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Carlos Caetano — Software Engineer</title>
  <desc id="desc">Editorial profile header for a software engineer in Belo Horizonte focused on backend systems, distributed systems, and application security.</desc>
  <style>
