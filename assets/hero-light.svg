  <text class="focus" x="184" y="213" fill="#202723" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="17" font-weight="700" letter-spacing="1.1">BACKEND SYSTEMS / DISTRIBUTED SYSTEMS / APPLICATION SECURITY</text>

  <g class="micro" fill="#202723" font-family="ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="15" font-weight="700" letter-spacing="1.5">
