      .micro, .grid { display: none; }
      .name { font-size: 60px; }
      .role { font-size: 32px; }
      .focus { font-size: 24px; letter-spacing: .5px; }
    }
  </style>

  <rect width="1200" height="300" fill="#EEE9DF"/>
  <g fill="none" stroke="#202723">
